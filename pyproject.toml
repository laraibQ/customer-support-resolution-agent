[project]
name = "meridian-support-resolution-agent"
version = "0.3.0"
description = "Customer support resolution agent (LangChain tools, TF-IDF RAG, Groq/OpenAI/Nebius)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain==1.4.2",
    "langchain-core==1.6.5",
    "langchain-openai==1.6.6",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.12",
    "scikit-learn==1.9.1",
    "streamlit==1.64.0",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
nebius = [
    "langchain-nebius==0.1.3",
]
faiss = [
    "langchain-community==0.4.2",
    "faiss-cpu==1.15.1",
    "langchain-huggingface==1.2.2",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "app", "config", "ingest", "main", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
