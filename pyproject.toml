[project]
name = "meridian-support-agent"
version = "1.0.0"
description = "Meridian Supply customer support resolution agent (LangChain + Groq + TF-IDF)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "laraibQ" }]
dependencies = [
    "langchain==1.4.2",
    "langchain-core==1.6.5",
    "langchain-openai==1.6.6",
    "langgraph==1.2.12",
    "scikit-learn==1.9.1",
    "streamlit==1.64.0",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
meridian-support = "main:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meridian_support*"]

[tool.setuptools]
py-modules = ["app", "main", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
